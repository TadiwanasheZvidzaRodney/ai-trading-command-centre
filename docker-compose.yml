services:
  mongo:
    image: mongo:8.0
    container_name: atc-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - atc-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  atc-mongo-data:
